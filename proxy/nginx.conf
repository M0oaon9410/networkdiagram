user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$http_cf_connecting_ip via $remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # NetPlan trusts CF-Connecting-IP and X-Forwarded-Proto, so only Cloudflare may reach it.
    # Ranges from https://www.cloudflare.com/ips/ (update when Cloudflare publishes changes).
    geo $from_cloudflare {
        default 0;
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name ifn-p.digitaltechnology.center;

        if ($from_cloudflare = 0) { return 444; }
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ifn-p.digitaltechnology.center;

        ssl_certificate     /etc/nginx/certs/ifn-p.pem;
        ssl_certificate_key /etc/nginx/certs/ifn-p.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        if ($from_cloudflare = 0) { return 444; }

        # NetPlan rejects request bodies over 5 MB
        client_max_body_size 6m;

        location / {
            proxy_pass http://netplan:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        }
    }

    # Requests for any other name (or straight to the IP) get dropped
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }
}
