services:
  netplan:
    build: .
    image: netplan:latest
    container_name: netplan
    ports:
      - "8088:8080"
    volumes:
      - netplan-data:/data
    restart: unless-stopped

  proxy:
    image: nginx:1.30.1-alpine
    container_name: netplan-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - netplan
    restart: unless-stopped

volumes:
  netplan-data:
