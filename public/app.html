<title>NetPlan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: toolbar on top; device palette | blueprint canvas | inspector. Stacks to one column on phones. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --panel-2: #f3f6f9;
  --canvas: #f8fafc;
  --grid: #d3dbe5;
  --fg: #18212d;
  --muted: #5d6a7a;
  --line: #d8dfe7;
  --accent: #2652c4;
  --accent-fg: #ffffff;
  --sel: #e19a06;
  --link: #6b7684;
  --danger: #c2392b;
  --font-ui: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --panel: #171c24; --panel-2: #1d232d; --canvas: #0e1217; --grid: #243041;
    --fg: #e3e8ef; --muted: #93a0b1; --line: #2a3340; --accent: #7d9bf2; --accent-fg: #0e1217;
    --sel: #f3b733; --link: #8a96a6; --danger: #ef6b5d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #171c24; --panel-2: #1d232d; --canvas: #0e1217; --grid: #243041;
  --fg: #e3e8ef; --muted: #93a0b1; --line: #2a3340; --accent: #7d9bf2; --accent-fg: #0e1217;
  --sel: #f3b733; --link: #8a96a6; --danger: #ef6b5d; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .02em; margin-right: 4px; }
.brand svg { width: 22px; height: 22px; }
.title-input { min-width: 0; width: 260px; max-width: 100%; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 8px; font-weight: 600; }
.title-input:hover, .title-input:focus { border-color: var(--line); background: var(--panel-2); }
.sep { width: 1px; height: 24px; background: var(--line); }
.grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; line-height: 1.2;
}
.btn:hover { background: var(--panel-2); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.sel-sm { padding: 5px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); }
.kbd { font-family: var(--font-mono); font-size: 11px; opacity: .7; }
.spacer { flex: 1; }
.server-pill { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.server-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.server-pill.on i { background: #2f9e5a; }

.main { min-height: 0; display: grid; grid-template-columns: 216px minmax(0, 1fr) 320px; }
.palette { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 10px 20px; }
.palette h3 { margin: 14px 4px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.palette h3:first-child { margin-top: 0; }
.pal-list { display: grid; grid-template-columns: 1fr; gap: 2px; }
.pal-item {
  display: flex; align-items: center; gap: 10px; padding: 6px 6px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; cursor: grab; text-align: left; width: 100%;
}
.pal-item:hover { background: var(--panel-2); border-color: var(--line); }
.pal-item .tile { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.pal-item .tile svg { width: 20px; height: 20px; }
.pal-hint { font-size: 12px; color: var(--muted); margin: 14px 4px 0; line-height: 1.5; }

.stage { position: relative; min-width: 0; min-height: 0; background: var(--canvas); overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#canvas.mode-connect { cursor: crosshair; }
#canvas.mode-zone { cursor: cell; }
.zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.zoomctl .btn { border: none; padding: 5px 8px; }
.zoomctl span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); align-self: center; min-width: 44px; text-align: center; }
.hint { position: absolute; left: 12px; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); max-width: calc(100% - 24px); }
.hint b { color: var(--fg); font-weight: 600; }

.inspector { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 14px 28px; }
.insp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.insp-head .tile { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.insp-head .tile svg { width: 24px; height: 24px; }
.insp-head h2 { font-size: 15px; margin: 0; line-height: 1.3; text-wrap: balance; }
.insp-head small { color: var(--muted); font-size: 12px; }
.sec { margin: 16px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.f.full { grid-column: 1 / -1; }
.f label { font-size: 12px; color: var(--muted); }
.f input, .f select, .f textarea {
  width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2);
}
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--accent); outline: none; background: var(--panel); }
.f .mono { font-family: var(--font-mono); font-size: 13px; }
.f textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
.colorrow { display: flex; gap: 8px; align-items: center; }
.colorrow input[type="color"] { width: 44px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); cursor: pointer; flex: none; }
.colorrow .hexbox { width: 100px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: 6px; }
.sw { aspect-ratio: 1; max-width: 100%; border-radius: 5px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.sw:hover { outline: 2px solid var(--fg); outline-offset: 1px; }
.custom-row { display: grid; grid-template-columns: 1fr 1.3fr auto; gap: 6px; margin-bottom: 6px; }
.custom-row input { min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; width: 32px; cursor: pointer; display: grid; place-items: center; }
.icon-btn svg { width: 14px; height: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.stats .n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.stats .t { display: flex; align-items: center; gap: 8px; }
.stats .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.help { font-size: 13px; color: var(--muted); line-height: 1.6; padding-left: 18px; margin: 0; }
.help b { color: var(--fg); font-weight: 600; }
.legend { display: grid; gap: 6px; font-size: 12.5px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend svg { width: 44px; height: 10px; flex: none; }
.muted { color: var(--muted); }

.overlay { position: fixed; inset: 0; background: rgb(10 14 20 / .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(640px, 100%); max-height: 90%; overflow: auto; padding: 18px; display: grid; gap: 12px; }
.modal h2 { margin: 0; font-size: 16px; }
.modal textarea { width: 100%; min-height: 260px; font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel-2); }
.list { display: grid; gap: 4px; }
.list-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.list-row.current { border-color: var(--accent); }
.list-row small { color: var(--muted); display: block; font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); }

/* SVG diagram */
.nlabel { font: 600 12.5px var(--font-ui); fill: var(--fg); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
.nip { font: 500 11px var(--font-mono); fill: var(--muted); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
.llabel { font: 500 11px var(--font-mono); fill: var(--fg); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
.lport { font: 500 10px var(--font-mono); fill: var(--muted); paint-order: stroke; stroke: var(--canvas); stroke-width: 3px; stroke-linejoin: round; }
.zlabel { font: 700 13px var(--font-ui); }
.ring { fill: none; stroke: var(--sel); stroke-width: 2.5; }
.node { cursor: pointer; }
.hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
.statdot { stroke: var(--canvas); stroke-width: 2; }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; display: block; }
  .main { display: flex; flex-direction: column; }
  .palette { border-right: none; border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; }
  .palette h3, .pal-hint { display: none; }
  .pal-list { display: flex; gap: 6px; }
  .pal-item { flex-direction: column; gap: 4px; width: 76px; font-size: 11px; text-align: center; padding: 6px 4px; }
  .stage { height: 64vh; min-height: 380px; }
  .inspector { border-left: none; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .title-input { width: 100%; order: 10; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand" aria-label="NetPlan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="5" rx="1"/><rect x="2.5" y="16.5" width="6" height="5" rx="1"/><rect x="15.5" y="16.5" width="6" height="5" rx="1"/><path d="M12 7.5v4.5M5.5 16.5V12h13v4.5"/></svg>

      <button class="btn" id="modeConnect" data-mode="connect" title="ลากสายเชื่อม (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="6" r="2.5"/><path d="M7 16 17 8"/></svg>เชื่อมสาย</button>

      <button class="btn" id="redoBtn" title="ทำซ้ำ (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 7 5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12"/></svg><span class="hide-sm">ทำซ้ำ</span></button>

    <span class="server-pill" id="serverPill" title=""><i></i><span>บันทึกในเบราว์เซอร์</span></span>
    <div class="grp">
      <button class="btn" id="filesBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H10l2 2h7.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>ผังทั้งหมด</button>
      <button class="btn" id="jsonBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H7a2 2 0 0 0-2 2v4l-2 2 2 2v4a2 2 0 0 0 2 2h1M16 4h1a2 2 0 0 1 2 2v4l2 2-2 2v4a2 2 0 0 1-2 2h-1"/></svg>เปิด/บันทึก JSON</button>
      <select id="exportSel" class="sel-sm" aria-label="ส่งออก">
        <option value="">ส่งออก…</option>
        <option value="png">รูปภาพ PNG</option>
        <option value="svg">รูปภาพ SVG</option>
        <option value="csv">รายการอุปกรณ์ CSV</option>

  <div class="main">

      <div class="zoomctl">
        <button class="btn" id="zoomOut" title="ซูมออก" aria-label="ซูมออก">−</button>
        <span id="zoomVal">100%</span>
        <button class="btn" id="zoomIn" title="ซูมเข้า" aria-label="ซูมเข้า">+</button>

</div>

<div class="overlay" id="jsonModal" hidden>

</div>

(() => {
"use strict";

/* ---------- Catalog ---------- */
const CATS = {

  security: { label: "ความปลอดภัย", color: "#c2462b" },

  facility: { label: "ระบบสนับสนุน", color: "#9a6b1a" },
};
const G = {
  internet: '<path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.4 4.3 4.3 0 0 0 7 18z"/>',
  router: '<circle cx="12" cy="12" r="8.5"/><path d="M12 6.5v4M10.5 8 12 6.5 13.5 8M12 17.5v-4M10.5 16 12 17.5l1.5-1.5M6.5 12h4M8 10.5 6.5 12 8 13.5M17.5 12h-4M16 10.5l1.5 1.5-1.5 1.5"/>',

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p) => p + "_" + Math.random().toString(36).slice(2, 9);
const snap = (v) => Math.round(v / 10) * 10;
const findNode = (id) => doc.nodes.find((n) => n.id === id);
const findLink = (id) => doc.links.find((l) => l.id === id);
const findZone = (id) => doc.zones.find((z) => z.id === id);
// A link end is either a device or a zone.
const endName = (id) => { const n = findNode(id); if (n) return n.name || TYPES[n.type].label; const z = findZone(id); return z ? z.name || "โซน" : "?"; };
const endCenter = (id) => { const n = findNode(id); if (n) return { x: n.x, y: n.y }; const z = findZone(id); return z ? { x: z.x + z.w / 2, y: z.y + z.h / 2 } : null; };
// Where a line toward `toward` meets the end: a device's center, or the zone's border.
function endAnchor(id, toward) {
  const n = findNode(id); if (n) return { x: n.x, y: n.y, zone: false };
  const z = findZone(id); if (!z) return null;
  const cx = z.x + z.w / 2, cy = z.y + z.h / 2;
  let dx = toward.x - cx, dy = toward.y - cy;
  if (!dx && !dy) dy = 1;
  const t = Math.min(dx ? z.w / 2 / Math.abs(dx) : Infinity, dy ? z.h / 2 / Math.abs(dy) : Infinity);
  return { x: cx + dx * t, y: cy + dy * t, zone: true };
}

function normalize(d) {
  if (!d || typeof d !== "object" || !Array.isArray(d.nodes)) throw new Error("ไม่พบรายการอุปกรณ์ (nodes) ในไฟล์");
  const out = { version: 1, title: String(d.title || "ผังเครือข่าย"), nodes: [], links: [], zones: [] };
  for (const n of d.nodes) {
    if (!n || !n.id) continue;
    out.nodes.push({ name: "", ip: "", mask: "", gateway: "", vlan: "", mac: "", vendor: "", model: "", serial: "", os: "", location: "", status: "active", notes: "",
      ...n, type: TYPES[n.type] ? n.type : "server", x: +n.x || 0, y: +n.y || 0, extra: { ...(n.extra || {}) }, custom: Array.isArray(n.custom) ? n.custom.map((c) => ({ k: String(c.k ?? ""), v: String(c.v ?? "") })) : [] });
  }
  for (const z of d.zones || []) {
    if (!z) continue;
    out.zones.push({ name: "", notes: "", ...z, id: z.id || uid("z"), x: +z.x || 0, y: +z.y || 0, w: Math.max(60, +z.w || 200), h: Math.max(40, +z.h || 120), color: ZONE_COLORS[z.color] || HEX_RE.test(z.color || "") ? z.color : "blue" });
  }
  const ids = new Set([...out.nodes.map((n) => n.id), ...out.zones.map((z) => z.id)]);
  for (const l of d.links || []) {
    if (!l || !ids.has(l.from) || !ids.has(l.to) || l.from === l.to) continue;
    out.links.push({ label: "", fromPort: "", toPort: "", notes: "", ...l, id: l.id || uid("l"), kind: LINKS[l.kind] ? l.kind : "eth" });
  }
  return out;
}

/* ---------- History ---------- */
function checkpoint() {
  undoStack.push(JSON.stringify(doc));
  if (undoStack.length > 120) undoStack.shift();
  redoStack = [];
  updateUndoButtons();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(doc));
  doc = JSON.parse(undoStack.pop());
  afterDocSwap();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(doc));
  doc = JSON.parse(redoStack.pop());
  afterDocSwap();
}
function afterDocSwap() {
  if (sel && !(sel.kind === "node" ? findNode(sel.id) : sel.kind === "link" ? findLink(sel.id) : findZone(sel.id))) sel = null;
  $("#docTitle").value = doc.title;
  render(); renderInspector(); updateUndoButtons(); persist();
}
function updateUndoButtons() {
  $("#undoBtn").disabled = !undoStack.length;
  $("#redoBtn").disabled = !redoStack.length;
}

/* ---------- Persistence ---------- */
let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ doc, docId })); } catch (e) {}
    if (server && docId) {
      try {
        const r = await fetch("api/diagrams/" + encodeURIComponent(docId), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(doc) });
        setPill(r.ok ? "บันทึกบนเซิร์ฟเวอร์แล้ว" : "บันทึกไม่สำเร็จ (" + r.status + ")", r.ok);
      } catch (e) { setPill("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้", false); }
    }

}
function setPill(text, on) {
  const p = $("#serverPill");
  p.classList.toggle("on", !!on);
  p.querySelector("span").textContent = text;
}
async function detectServer() {
  try {
    const r = await fetch("api/health", { cache: "no-store" });
    if (!r.ok) return false;
    const j = await r.json();
    return j && j.app === "netplan";
  } catch (e) { return false; }

/* ---------- Geometry ---------- */
function toWorld(e) {
  const r = svg.getBoundingClientRect();
  return { x: (e.clientX - r.left - view.x) / view.k, y: (e.clientY - r.top - view.y) / view.k };
}
function applyView() {
  world.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
  $("#bgRect").setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
  $("#zoomVal").textContent = Math.round(view.k * 100) + "%";
}
function zoomAt(factor, cx, cy) {
  const k = Math.min(3, Math.max(0.2, view.k * factor));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k; applyView();
}
function bbox(d = doc) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of d.nodes) { x0 = Math.min(x0, n.x - 70); x1 = Math.max(x1, n.x + 70); y0 = Math.min(y0, n.y - 40); y1 = Math.max(y1, n.y + 68); }
  for (const z of d.zones) { x0 = Math.min(x0, z.x); y0 = Math.min(y0, z.y - 6); x1 = Math.max(x1, z.x + z.w); y1 = Math.max(y1, z.y + z.h); }
  if (!isFinite(x0)) return { x: 0, y: 0, w: 800, h: 500 };
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
function fit() {
  const r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const b = bbox(), pad = 40;
  const k = Math.min(1.4, Math.max(0.2, Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h)));
  view.k = k;
  view.x = (r.width - b.w * k) / 2 - b.x * k;
  view.y = (r.height - b.h * k) / 2 - b.y * k;
  applyView();
}

}

    drag = { type: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
  }
  svg.setPointerCapture(e.pointerId);
  render();
});
svg.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const p = toWorld(e);
  if (drag.type === "pan") { view.x = drag.vx + e.clientX - drag.sx; view.y = drag.vy + e.clientY - drag.sy; applyView(); return; }
  if (drag.type === "node") { const n = findNode(drag.id); n.x = snap(p.x - drag.ox); n.y = snap(p.y - drag.oy); drag.moved = true; }
  else if (drag.type === "zone") {
    const z = findZone(drag.id), dx = snap(p.x - drag.px), dy = snap(p.y - drag.py);
    z.x = drag.sx + dx; z.y = drag.sy + dy;
    drag.inside.forEach((nid, i) => { const n = findNode(nid); n.x = drag.start[i][0] + dx; n.y = drag.start[i][1] + dy; });
    drag.moved = true;
  } else if (drag.type === "resize") {
    const z = findZone(drag.id); z.w = Math.max(80, snap(p.x - z.x)); z.h = Math.max(50, snap(p.y - z.y)); drag.moved = true;
  } else if (drag.type === "link") { drag.cx = p.x; drag.cy = p.y; }
  else if (drag.type === "newzone") { drag.x1 = snap(p.x); drag.y1 = snap(p.y); }
  render();
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if ((d.type === "node" || d.type === "zone" || d.type === "resize") && d.moved) {
    undoStack.push(d.before); redoStack = []; updateUndoButtons(); persist();
  } else if (d.type === "link") {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const t = el && el.closest && el.closest('[data-kind="node"],[data-kind="zone"]');
    const moved = Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 6;
    if (t && t.dataset.id !== d.from) addLink(d.from, t.dataset.id);
    else if (!moved) pendingFrom = d.from;
    else pendingFrom = null;
  } else if (d.type === "newzone") {
    const r = normRect(d);
    if (r.w >= 60 && r.h >= 40) {
      checkpoint();
      const z = { id: uid("z"), ...r, name: "โซนใหม่", color: "blue", notes: "" };
      doc.zones.push(z); sel = { kind: "zone", id: z.id };
      setMode("select"); renderInspector(); persist();
      setTimeout(() => { const i = $("#f_name"); i && (i.focus(), i.select()); }, 0);
    }
  }
  if (d.type === "node" || d.type === "zone") renderInspector();
  render();
}
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", () => { drag = null; render(); });
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
svg.addEventListener("dblclick", (e) => {
  const t = e.target.closest('[data-kind="node"],[data-kind="zone"]');
  if (t) setTimeout(() => { const i = $("#f_name"); i && (i.focus(), i.select()); }, 0);
});

/* ---------- Keyboard ---------- */
document.addEventListener("keydown", (e) => {
  const typing = e.target.matches("input,textarea,select");
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y" && !typing) { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === "d" && !typing) { e.preventDefault(); duplicate(); return; }
  if (typing) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSelected(); }
  else if (e.key === "Escape") { if (pendingFrom || mode !== "select") setMode("select"); else { sel = null; render(); renderInspector(); } closeModals(); }
  else if (e.key === "v" || e.key === "V") setMode("select");
  else if (e.key === "c" || e.key === "C") setMode("connect");
  else if (e.key === "z" || e.key === "Z") setMode("zone");
  else if (e.key === "+" || e.key === "=") { const r = svg.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); }
  else if (e.key === "-") { const r = svg.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); }
  else if (sel && sel.kind === "node" && e.key.startsWith("Arrow")) {
    e.preventDefault(); checkpoint();
    const n = findNode(sel.id), s = e.shiftKey ? 50 : 10;
    if (e.key === "ArrowLeft") n.x -= s; if (e.key === "ArrowRight") n.x += s; if (e.key === "ArrowUp") n.y -= s; if (e.key === "ArrowDown") n.y += s;
    render(); persist();
  }
});

/* ---------- Toolbar ---------- */
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
}
for (const b of document.querySelectorAll("[data-mode]")) b.addEventListener("click", () => setMode(b.dataset.mode));
$("#linkKind").innerHTML = Object.entries(LINKS).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join("");
try { const r = localStorage.getItem("netplan.route"); if (r === "elbow" || r === "straight") $("#linkRoute").value = r; } catch (e) {}
$("#linkRoute").addEventListener("change", (e) => { try { localStorage.setItem("netplan.route", e.target.value); } catch (err) {} });
$("#undoBtn").onclick = undo; $("#redoBtn").onclick = redo;
$("#zoomIn").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); };
$("#zoomOut").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); };
$("#zoomFit").onclick = fit;
$("#docTitle").addEventListener("focus", () => (editSnapshot = JSON.stringify(doc)));
$("#docTitle").addEventListener("input", (e) => { doc.title = e.target.value; persist(); if (!sel) renderInspector(); });
$("#docTitle").addEventListener("blur", () => { if (editSnapshot && editSnapshot !== JSON.stringify(doc)) { undoStack.push(editSnapshot); redoStack = []; updateUndoButtons(); } editSnapshot = null; });

const newBtn = $("#newBtn");
newBtn.addEventListener("click", async () => {
  if (!newBtn.classList.contains("armed")) {
    newBtn.classList.add("armed"); newBtn.textContent = "กดอีกครั้งเพื่อล้างผัง";
    clearTimeout(newBtn._t); newBtn._t = setTimeout(() => { newBtn.classList.remove("armed"); newBtn.textContent = "ผังใหม่"; }, 3500);
    return;
  }
  clearTimeout(newBtn._t); newBtn.classList.remove("armed"); newBtn.textContent = "ผังใหม่";
  await newDiagram();
});
async function newDiagram() {
  if (server) { await createOnServer({ version: 1, title: "ผังเครือข่ายใหม่", nodes: [], links: [], zones: [] }); return; }
  checkpoint();
  doc = { version: 1, title: "ผังเครือข่ายใหม่", nodes: [], links: [], zones: [] };
  sel = null; afterDocSwap(); view = { x: 0, y: 0, k: 1 }; applyView();
  toast("เริ่มผังใหม่แล้ว กด ย้อน ถ้าต้องการผังเดิมคืน");
}

/* ---------- Files: downloads ---------- */
const dlPromise = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
function safeName(ext) { return (doc.title || "network-diagram").replace(/[\\/:*?"<>|]+/g, "-").trim().slice(0, 80) + "." + ext; }
async function saveFile(filename, data, mime) {
  const dl = await dlPromise;
  if (dl) {
    try { await dl.save({ filename, data }); toast("บันทึกไฟล์ " + filename + " แล้ว"); }
    catch (err) { if (err && err.code !== "declined") toast("บันทึกไฟล์ไม่สำเร็จ: " + (err.message || err.code)); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const EXPORT_CSS = `.nlabel{font:600 12.5px 'IBM Plex Sans Thai','Noto Sans Thai',Tahoma,sans-serif;fill:#18212d;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.nip{font:500 11px 'IBM Plex Mono',Consolas,monospace;fill:#5d6a7a;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.llabel{font:500 11px 'IBM Plex Mono',Consolas,monospace;fill:#18212d;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.lport{font:500 10px 'IBM Plex Mono',Consolas,monospace;fill:#5d6a7a;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.zlabel{font:700 13px 'IBM Plex Sans Thai','Noto Sans Thai',Tahoma,sans-serif}.statdot{stroke:#fff;stroke-width:2}
.ttl{font:700 18px 'IBM Plex Sans Thai','Noto Sans Thai',Tahoma,sans-serif;fill:#18212d}.sub{font:400 12px 'IBM Plex Sans Thai',Tahoma,sans-serif;fill:#5d6a7a}`;
function exportSVG() {
  const b = bbox(), pad = 40, head = 56;
  const w = Math.ceil(b.w + pad * 2), h = Math.ceil(b.h + pad * 2 + head);
  const date = new Date().toLocaleDateString("th-TH", { year: "numeric", month: "long", day: "numeric" });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><style>${EXPORT_CSS}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="ttl" x="${pad}" y="34">${esc(doc.title)}</text><text class="sub" x="${pad}" y="54">อุปกรณ์ ${doc.nodes.length} · สาย ${doc.links.length} · ${esc(date)}</text>
<g transform="translate(${pad - b.x} ${pad + head - b.y})">${diagramMarkup({ export: true })}</g></svg>`;
}
function exportPNG() {
  return new Promise((resolve, reject) => {
    const s = exportSVG();
    const m = s.match(/width="(\d+)" height="(\d+)"/);
    const w = +m[1], h = +m[2], scale = Math.min(2, 8000 / Math.max(w, h));
    const img = new Image();
    const url = URL.createObjectURL(new Blob([s], { type: "image/svg+xml" }));
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      const ctx = c.getContext("2d"); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      c.toBlob((bl) => (bl ? resolve(bl) : reject(new Error("png"))), "image/png");
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("svg")); };
    img.src = url;
  });
}
function exportCSV() {
  const cols = [["name", "ชื่อ"], ["type", "ชนิด"], ["status", "สถานะ"], ["ip", "IP"], ["mask", "Subnet"], ["gateway", "Gateway"], ["vlan", "VLAN"], ["mac", "MAC"], ["vendor", "ยี่ห้อ"], ["model", "รุ่น"], ["serial", "Serial"], ["os", "OS/Firmware"], ["location", "ตำแหน่ง"], ["extra", "ข้อมูลเฉพาะ"], ["custom", "ฟิลด์เพิ่มเติม"], ["links", "เชื่อมต่อกับ"], ["notes", "หมายเหตุ"]];
  const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const rows = [cols.map((c) => q(c[1])).join(",")];
  for (const n of doc.nodes) {
    const t = TYPES[n.type];
    const vals = cols.map(([k]) => {
      if (k === "type") return t.label;
      if (k === "status") return STATUS[n.status]?.label || n.status;
      if (k === "extra") return t.extra.filter((x) => n.extra[x]).map((x) => `${EXTRA_LABELS[x]}: ${n.extra[x]}`).join("; ");
      if (k === "custom") return n.custom.filter((c) => c.k || c.v).map((c) => `${c.k}: ${c.v}`).join("; ");
      if (k === "links") return doc.links.filter((l) => l.from === n.id || l.to === n.id).map((l) => endName(l.from === n.id ? l.to : l.from)).join("; ");
      return n[k];
    });
    rows.push(vals.map(q).join(","));
  }
  return "﻿" + rows.join("\r\n");
}
$("#exportSel").addEventListener("change", async (e) => {
  const v = e.target.value; e.target.value = "";
  try {
    if (v === "svg") await saveFile(safeName("svg"), exportSVG(), "image/svg+xml");
    else if (v === "png") await saveFile(safeName("png"), await exportPNG(), "image/png");
    else if (v === "csv") await saveFile(safeName("csv"), exportCSV(), "text/csv");
    else if (v === "json") await saveFile(safeName("json"), JSON.stringify(doc, null, 2), "application/json");
  } catch (err) { toast("ส่งออกไม่สำเร็จ ลองอีกครั้ง"); }
});

/* ---------- JSON modal ---------- */
function openModal(id) { $(id).hidden = false; }
function closeModals() { for (const m of document.querySelectorAll(".overlay")) m.hidden = true; }
for (const m of document.querySelectorAll(".overlay")) {
  m.addEventListener("click", (e) => { if (e.target === m || e.target.closest("[data-close]")) m.hidden = true; });
}
$("#jsonBtn").onclick = () => { $("#jsonText").value = JSON.stringify(doc, null, 2); openModal("#jsonModal"); };
$("#jsonCopy").onclick = async () => {
  const ta = $("#jsonText");
  try { await navigator.clipboard.writeText(ta.value); toast("คัดลอกแล้ว"); }
  catch (e) { ta.focus(); ta.select(); toast("เลือกข้อความแล้ว กด Ctrl+C เพื่อคัดลอก"); }
};
$("#jsonSave").onclick = () => saveFile(safeName("json"), JSON.stringify(doc, null, 2), "application/json");
function loadDoc(d) {
  const nd = normalize(d);
  checkpoint(); doc = nd; sel = null; afterDocSwap(); fit();
}
$("#jsonLoad").onclick = () => {
  try { loadDoc(JSON.parse($("#jsonText").value)); closeModals(); persistNewOrCurrent(); toast("โหลดผังแล้ว"); }
  catch (e) { toast("อ่าน JSON ไม่ได้: " + e.message); }
};
$("#jsonFile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { loadDoc(JSON.parse(await f.text())); closeModals(); persistNewOrCurrent(); toast("เปิดไฟล์ " + f.name + " แล้ว"); }
  catch (err) { toast("เปิดไฟล์ไม่ได้: " + err.message); }
});
async function persistNewOrCurrent() {
  if (server) await createOnServer(doc, true); else persist();
}

/* ---------- Server diagrams ---------- */
async function createOnServer(d, keepDoc) {
  try {
    const r = await fetch("api/diagrams", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (!keepDoc) { checkpoint(); doc = normalize(d); sel = null; afterDocSwap(); view = { x: 0, y: 0, k: 1 }; applyView(); }
    docId = j.id; persist(); closeModals();
    toast("สร้างผังบนเซิร์ฟเวอร์แล้ว");
  } catch (e) { toast("สร้างผังบนเซิร์ฟเวอร์ไม่สำเร็จ"); }
}
async function openFiles() {
  const box = $("#filesList");
  box.innerHTML = `<p class="muted">กำลังโหลด…</p>`;
  openModal("#filesModal");
  try {
    const list = await (await fetch("api/diagrams", { cache: "no-store" })).json();
    if (!list.length) { box.innerHTML = `<p class="muted">ยังไม่มีผังบนเซิร์ฟเวอร์</p>`; return; }
    box.innerHTML = list.map((x) => `<div class="list-row${x.id === docId ? " current" : ""}"><div><b>${esc(x.title)}</b><small>อุปกรณ์ ${x.nodes} · แก้ไขล่าสุด ${esc(new Date(x.updatedAt).toLocaleString("th-TH"))}${x.id === docId ? " · กำลังเปิดอยู่" : ""}</small></div><button class="btn" data-open="${esc(x.id)}">เปิด</button><button class="btn danger" data-del="${esc(x.id)}">ลบ</button></div>`).join("");
  } catch (e) { box.innerHTML = `<p class="muted">โหลดรายการไม่ได้ ตรวจสอบว่าเซิร์ฟเวอร์ทำงานอยู่</p>`; }
}
$("#filesBtn").onclick = openFiles;
$("#filesNew").onclick = () => createOnServer({ version: 1, title: "ผังเครือข่ายใหม่", nodes: [], links: [], zones: [] });
$("#filesList").addEventListener("click", async (e) => {
  const o = e.target.closest("[data-open]"), d = e.target.closest("[data-del]");
  if (o) {
    try {
      const r = await fetch("api/diagrams/" + encodeURIComponent(o.dataset.open), { cache: "no-store" });
      const j = normalize(await r.json());
      doc = j; docId = o.dataset.open; undoStack = []; redoStack = []; sel = null; afterDocSwap(); fit(); closeModals();
    } catch (err) { toast("เปิดผังไม่ได้"); }
  }
  if (d) {
    if (!d.classList.contains("armed")) { d.classList.add("armed"); d.textContent = "ยืนยันลบ"; return; }
    await fetch("api/diagrams/" + encodeURIComponent(d.dataset.del), { method: "DELETE" });
    if (d.dataset.del === docId) docId = null;
    openFiles();
  }
});

/* ---------- Boot ---------- */
function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) {}
  try { doc = saved && saved.doc ? normalize(saved.doc) : sample(); docId = saved?.docId || null; } catch (e) { doc = sample(); }
  $("#docTitle").value = doc.title;
  buildPalette(); setMode("select"); renderInspector(); updateUndoButtons();
  requestAnimationFrame(fit);
  window.addEventListener("resize", () => { if (!doc.nodes.length) return; });
  detectServer().then(async (ok) => {
    server = ok;
    if (!ok) { setPill("บันทึกอัตโนมัติในเบราว์เซอร์นี้", false); return; }
    $("#filesBtn").hidden = false;
    setPill("เชื่อมต่อเซิร์ฟเวอร์แล้ว", true);
    try {
      if (docId) {
        const r = await fetch("api/diagrams/" + encodeURIComponent(docId), { cache: "no-store" });
        if (r.ok) { doc = normalize(await r.json()); afterDocSwap(); fit(); return; }
      }
      const list = await (await fetch("api/diagrams", { cache: "no-store" })).json();
      if (list.length) {
        const r = await fetch("api/diagrams/" + encodeURIComponent(list[0].id), { cache: "no-store" });
        doc = normalize(await r.json()); docId = list[0].id; afterDocSwap(); fit();
      } else {
        await createOnServer(doc, true);
      }
    } catch (e) { setPill("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้", false); }
  });
}
boot();
})();
</script>
